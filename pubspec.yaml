name: dkc_handyapp
description: DKC HandyApp - Mobile client for DK-Control API
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP
  dio: ^5.8.0+1

  # Local database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.24
  drift_flutter: ^0.2.4

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Navigation
  go_router: ^15.1.2

  # Connectivity
  connectivity_plus: ^6.1.4

  # Utils
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  freezed: ^2.5.8
  riverpod_generator: ^2.6.1
  json_serializable: ^6.9.5
  drift_dev: ^2.22.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
